<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaAI</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: Georgia, serif; }
    ::placeholder { color: #64748b; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #2d3f55; border-radius: 4px; }
    @keyframes pop { 0%{transform:scale(0.9);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes dot { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
    .msg-in { animation: pop 0.25s ease; }
    @media(min-width:700px){
      .layout { display:grid; grid-template-columns:1fr 300px; gap:16px; max-width:960px; margin:0 auto; padding:16px; }
      .mob-toggle { display:none !important; }
    }
    @media(max-width:699px){
      .layout { display:flex; flex-direction:column; padding:8px; }
      .side-panel { border-radius:14px; margin-top:12px; }
      .mob-toggle { display:flex !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

const LANGS = [
  { code:"en", label:"English", flag:"🇬🇧" },
  { code:"fr", label:"Français", flag:"🇫🇷" },
  { code:"es", label:"Español", flag:"🇪🇸" },
  { code:"de", label:"Deutsch", flag:"🇩🇪" },
  { code:"it", label:"Italiano", flag:"🇮🇹" },
  { code:"ja", label:"日本語", flag:"🇯🇵" },
  { code:"pt", label:"Português", flag:"🇵🇹" },
];

const CEFR = ["A1","A2","B1","B2","C1","C2"];

const GREET = {
  en:`Hey Rovany! I'm so glad you're here 😄. Think of me as your smartest friend — the one who grew up speaking English, loves a good idiom, and won't let a grammar slip go unnoticed. But I'll always correct you *gently*, the way a real friend would. Let's just talk! Tell me about your day, your work, your dreams — anything. The more you write, the more I'll help. Ready?`,
  fr:`Salut Rovany ! Je suis ton coach de français personnel. Parle-moi de tout et n'importe quoi — et je te corrige avec bienveillance, comme un vrai ami bilingue le ferait. Allons-y !`,
  es:`¡Hola Rovany! Soy tu tutor de español — un amigo que habla español con fluidez y que te ayudará a mejorar de forma natural. ¡Cuéntame algo!`,
  de:`Hallo Rovany! Ich bin dein persönlicher Deutschlehrer und bester Freund zugleich. Lass uns einfach reden!`,
  it:`Ciao Rovany! Sono il tuo tutor di italiano, un amico caloroso che ti aiuterà a migliorare passo dopo passo. Parliamo!`,
  ja:`こんにちは、Rovany！私はあなたの日本語の友達です。何でも話しかけてください！`,
  pt:`Olá Rovany! Sou o seu tutor de português, um amigo que o ajudará a melhorar naturalmente. Vamos conversar!`,
};

const ACC="#10b981", DARK="#0f172a", CARD="#1e293b", CARD2="#263145", BORDER="#2d3f55", TXT="#e2e8f0", TXTS="#94a3b8", TXTT="#64748b";

const API_URL = "/api/chat";

function sample(arr, n) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}
function seed() { return Math.random().toString(36).slice(2, 8); }
function cleanText(t) { return t.replace(/^#+\s.*$/gm, "").replace(/[*_`]/g, "").trim(); }

const LANG_BCP = {en:"en-US",fr:"fr-FR",es:"es-ES",de:"de-DE",it:"it-IT",ja:"ja-JP",pt:"pt-BR"};
const QUIZ_THEMES = ["idioms and expressions","verbs","adjectives","conjunctions and connectors","professional vocabulary","everyday life","abstract nouns","adverbs","false friends","collocations","slang and informal speech","academic vocabulary"];
const ORAL_THEMES = ["Ma journée de travail","Un voyage de rêve","La technologie et l'avenir","Mon film préféré","Les défis de la vie moderne","Une personne qui m'inspire","Mes ambitions professionnelles","La cuisine et les traditions","Le sport et la santé","L'énergie et l'environnement","Une rencontre inattendue","Les réseaux sociaux","Un souvenir d'enfance","L'argent et l'indépendance","La musique","Une panne et ses leçons","La ville contre la campagne","Apprendre une langue","Un projet entrepreneurial","Une décision difficile"];
const ORAL_STYLES = ["a personal story","a short opinion piece","a vivid description","an anecdote with humor","a news-style paragraph","advice to a friend","a reflective monologue"];

async function callAI(body) {
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    throw new Error(err.detail || `Erreur ${res.status}`);
  }
  return res.json();
}

function Bar({ pct, color=ACC }) {
  return (
    <div style={{height:6,background:"#1e3a2f",borderRadius:6,overflow:"hidden",marginTop:4}}>
      <div style={{height:"100%",width:`${Math.max(0,Math.min(100,pct))}%`,background:color,borderRadius:6,transition:"width 0.6s"}} />
    </div>
  );
}

function Tag({ children, color=ACC }) {
  return <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,border:`1px solid ${color}44`,color,background:color+"18",fontWeight:500}}>{children}</span>;
}

function now() { return new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }

function App() {
  const [lang, setLang] = React.useState(LANGS[0]);
  const [mode, setMode] = React.useState("chat");
  const [messages, setMessages] = React.useState([{role:"assistant",text:GREET.en,ts:now()}]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [feedback, setFeedback] = React.useState([]);
  const [vocab, setVocab] = React.useState([]);
  const [cefr, setCefr] = React.useState("A2");
  const [stats, setStats] = React.useState({grammar:40,vocabulary:30,fluency:25,msgs:0,corrections:0,quizDone:0});
  const [objectives, setObjectives] = React.useState(["Maîtriser les idioms courants","Élargir le vocabulaire académique (TOEFL)","Améliorer la fluidité conversationnelle"]);
  const [newObj, setNewObj] = React.useState("");
  const [addingObj, setAddingObj] = React.useState(false);
  const [quiz, setQuiz] = React.useState(null);
  const [quizLoading, setQuizLoading] = React.useState(false);
  const [panelOpen, setPanelOpen] = React.useState(true);
  const [importMsg, setImportMsg] = React.useState("");
  const [journalOpen, setJournalOpen] = React.useState(false);
  const [journal, setJournal] = React.useState([]);
  const [oralText, setOralText] = React.useState("");
  const [oralTopic, setOralTopic] = React.useState("");
  const [oralLoading, setOralLoading] = React.useState(false);
  const [listening, setListening] = React.useState(false);
  const [transcript, setTranscript] = React.useState("");
  const [oralFeedback, setOralFeedback] = React.useState(null);
  const [oralEval, setOralEval] = React.useState(false);
  const [speaking, setSpeaking] = React.useState(false);
  const bottomRef = React.useRef(null);
  const fileRef = React.useRef(null);
  const inputRef = React.useRef(null);
  const recognitionRef = React.useRef(null);
  const synthRef = React.useRef(window.speechSynthesis);

  React.useEffect(() => { bottomRef.current?.scrollIntoView({behavior:"smooth"}); }, [messages, loading]);

  const seenQuiz = React.useRef([]);
  const seenOral = React.useRef([]);

  function changeLang(code) {
    const l = LANGS.find(x=>x.code===code);
    setLang(l);
    synthRef.current?.cancel(); setSpeaking(false);
    setOralText(""); setOralFeedback(null); setTranscript("");
    seenQuiz.current = []; seenOral.current = [];
    setMessages([{role:"assistant",text:GREET[code]||GREET.en,ts:now()}]);
    setFeedback([]);
    setCefr("A2");
    setStats({grammar:40,vocabulary:30,fluency:25,msgs:0,corrections:0,quizDone:0});
  }

  async function send() {
    if (!input.trim()||loading) return;
    const userMsg = {role:"user",text:input.trim(),ts:now()};
    setMessages(p=>[...p,userMsg]);
    setInput("");
    setLoading(true);
    inputRef.current?.focus();
    const vocabHint = vocab.length>0 ? `\n\nUser's vocabulary list (weave naturally): ${vocab.slice(0,25).map(v=>v.word).join(", ")}.` : "";
    const history = [...messages,userMsg].slice(-12).map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}));
    const sys = `You are LinguaAI — the user's absolute best friend AND the world's greatest language tutor. Warm, witty, intellectually stimulating, deeply human. Target language: ${lang.label}. Always reply naturally in ${lang.label}.\n\nAfter your natural reply, append:\n\n---FEEDBACK---\nList feedback items (✅ praise, ⚠️ corrections), 1-4 items max.\n\n---SCORES---\nJSON only: {"grammar":65,"vocabulary":50,"fluency":55,"cefr":"B1"}\n\nUser objectives: ${objectives.join(", ")}.${vocabHint}`;
    try {
      const data = await callAI({model:"claude-haiku-4-5-20251001",max_tokens:1000,system:sys,messages:history});
      const raw = data.content?.[0]?.text||"";
      const [main,rest1] = raw.split("---FEEDBACK---");
      const [fbRaw,scRaw] = (rest1||"").split("---SCORES---");
      const fbLines = (fbRaw||"").trim().split("\n").map(l=>l.trim()).filter(l=>l.length>2);
      if (fbLines.length) setFeedback(p=>[...fbLines,...p].slice(0,40));
      try {
        const sc = JSON.parse((scRaw||"{}").replace(/```json|```/g,"").trim());
        if (sc.grammar) setStats(p=>({...p,grammar:sc.grammar,vocabulary:sc.vocabulary,fluency:sc.fluency,msgs:p.msgs+1,corrections:p.corrections+fbLines.filter(f=>f.startsWith("⚠️")).length}));
        if (sc.cefr&&CEFR.includes(sc.cefr)) setCefr(sc.cefr);
      } catch {}
      setMessages(p=>[...p,{role:"assistant",text:main.trim(),ts:now()}]);
    } catch(e) {
      setMessages(p=>[...p,{role:"assistant",text:`Erreur : ${e.message}`,ts:now()}]);
    }
    setLoading(false);
  }

  async function genQuiz() {
    setMode("quiz"); setQuiz(null); setQuizLoading(true);
    const seen = seenQuiz.current;
    const pool = vocab.filter(v=>!seen.includes(v.word));
    const hint = pool.length>=6
      ? `Choose exactly 4 words for the 4 questions, among these randomly picked candidates (skip any that are not real ${lang.label} words): ${sample(pool,8).map(v=>v.word).join(", ")}.`
      : `Choose 4 varied ${lang.label} words or expressions of ${cefr} level or slightly above. Theme: ${sample(QUIZ_THEMES,1)[0]}. Be creative and avoid the most common textbook words. Random seed: ${seed()}.`;
    const avoid = seen.length ? `\nNever use any of these already-seen words: ${seen.slice(-60).join(", ")}.` : "";
    try {
      const data = await callAI({model:"claude-haiku-4-5-20251001",max_tokens:1200,messages:[{role:"user",content:`Generate 4 quiz questions for a ${lang.label} learner. ${hint}${avoid}\nEach question: word, grammatical type, question in French, 4 choices (one correct, shuffled so the correct index varies), correct index (0-3), French explanation with example.\nRespond ONLY with a JSON array, no markdown:\n[{"word":"eager beaver","type":"Idiom","question":"Que signifie cette expression ?","choices":["Paresseux","Très zélé","Triste","Courageux"],"correct":1,"explanation":"Désigne quelqu'un de très enthousiaste. Ex: She's an eager beaver — always first to volunteer."}]`}]});
      const raw = (data.content?.[0]?.text||"[]").replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(raw);
      seenQuiz.current = [...seen, ...parsed.map(q=>q.word)].slice(-300);
      setQuiz(parsed.map(q=>({...q,selected:null,answered:false})));
    } catch { setQuiz([]); }
    setQuizLoading(false);
  }

  function answerQuiz(qi,ci) {
    if (quiz[qi].answered) return;
    const correct = quiz[qi].correct===ci;
    setQuiz(p=>p.map((q,i)=>i===qi?{...q,selected:ci,answered:true}:q));
    setStats(p=>({...p,quizDone:p.quizDone+1,vocabulary:Math.min(100,p.vocabulary+(correct?4:0))}));
  }

  function handleImport(e) {
    const file = e.target.files[0]; if (!file) return;
    const name = file.name.toLowerCase();
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        let words=[];
        if (name.endsWith(".csv")||name.endsWith(".txt")||name.endsWith(".md")) {
          words=evt.target.result.split(/[\n,;\t]+/).map(v=>v.replace(/^"|"$/g,"").trim()).filter(v=>v.length>1).map(v=>({word:v}));
        } else {
          const S=window.XLSX; if(!S){setImportMsg("❌ Utilisez un fichier CSV.");return;}
          const wb=S.read(new Uint8Array(evt.target.result),{type:"array"});
          const ws=wb.Sheets[wb.SheetNames[0]];
          words=S.utils.sheet_to_json(ws,{header:1}).flat().filter(v=>typeof v==="string"&&v.trim().length>1).map(v=>({word:v.trim()}));
        }
        setVocab(words); setImportMsg(`✅ ${words.length} mots importés !`);
        setTimeout(()=>setImportMsg(""),4000);
      } catch { setImportMsg("❌ Erreur de lecture."); }
    };
    name.endsWith(".csv")||name.endsWith(".txt")||name.endsWith(".md") ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
    e.target.value="";
  }

  async function genJournal() {
    if (messages.length<3) return;
    setJournalOpen(true);
    try {
      const data = await callAI({model:"claude-haiku-4-5-20251001",max_tokens:400,messages:[{role:"user",content:`Résume cette session d'apprentissage en 3-4 phrases en français. Points forts, points à améliorer, progrès notables. Conversation:\n${messages.slice(-10).map(m=>`${m.role}: ${m.text}`).join("\n")}`}]});
      setJournal(p=>[{date:new Date().toLocaleDateString("fr-FR"),lang:lang.label,text:data.content?.[0]?.text||""},...p].slice(0,5));
    } catch {}
  }

  async function genOralText(topic) {
    setOralLoading(true); setOralFeedback(null); setTranscript("");
    synthRef.current?.cancel(); setSpeaking(false);
    const t = topic||sample(ORAL_THEMES,1)[0];
    setOralTopic(topic||"");
    const style = sample(ORAL_STYLES,1)[0];
    const avoid = seenOral.current.length ? ` Do not reuse any of these earlier openings: ${seenOral.current.slice(-8).join(" | ")}.` : "";
    try {
      const data = await callAI({
        model:"claude-haiku-4-5-20251001", max_tokens:500,
        system:`You write original reading-aloud passages for language learners. You write ONLY in ${lang.label}, never in any other language, even if the theme is given in French.`,
        messages:[{role:"user",content:`Write an original passage ENTIRELY in ${lang.label} (7-10 sentences) for a learner at ${cefr} level to read aloud. Inspiration theme (translate the idea, do not copy it as a title): "${t}". Style: ${style}. Choose a surprising, specific angle. Use varied vocabulary, idioms and natural expressions. No title, no heading, no markdown, no translation, no comment. Output only the passage.${avoid} Random seed: ${seed()}.`}]
      });
      const txt = cleanText(data.content?.[0]?.text||"");
      seenOral.current = [...seenOral.current, txt.slice(0,60)].slice(-30);
      setOralText(txt);
    } catch { setOralText("Erreur lors de la génération. Réessayez."); }
    setOralLoading(false);
  }

  function speakText(txt) {
    if (!synthRef.current) return;
    synthRef.current.cancel();
    const voices=synthRef.current.getVoices();
    const bcp=LANG_BCP[lang.code]||"en-US";
    const norm=s=>s.toLowerCase().replace("_","-");
    const voice=voices.find(v=>norm(v.lang)===norm(bcp))||voices.find(v=>norm(v.lang).startsWith(lang.code));
    const utt=new SpeechSynthesisUtterance(txt);
    utt.lang=bcp;
    if (voice) utt.voice=voice;
    utt.rate=0.9; utt.pitch=1;
    utt.onstart=()=>setSpeaking(true);
    utt.onend=()=>setSpeaking(false);
    synthRef.current.speak(utt);
  }

  function stopSpeak() { synthRef.current?.cancel(); setSpeaking(false); }

  function startListen() {
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if (!SR){alert("Votre navigateur ne supporte pas la reconnaissance vocale.");return;}
    const rec=new SR();
    const langMap={en:"en-US",fr:"fr-FR",es:"es-ES",de:"de-DE",it:"it-IT",ja:"ja-JP",pt:"pt-BR"};
    rec.lang=langMap[lang.code]||"en-US"; rec.continuous=true; rec.interimResults=true;
    rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;setTranscript(t);};
    rec.onerror=()=>setListening(false); rec.onend=()=>setListening(false);
    recognitionRef.current=rec; rec.start(); setListening(true);
  }

  function stopListen() { recognitionRef.current?.stop(); setListening(false); }

  async function evalOral() {
    if (!transcript.trim()) return;
    setOralEval(true); setOralFeedback(null);
    try {
      const data = await callAI({model:"claude-haiku-4-5-20251001",max_tokens:600,system:`You are a warm, expert language coach evaluating spoken ${lang.label}. Always respond in French.`,messages:[{role:"user",content:`Reference text: "${oralText}"\n\nStudent said: "${transcript}"\n\nEvaluate. Give:\n1. Score /10: {"fluency":7,"vocabulary":6,"grammar":8}\n2. 2-3 feedback points (✅ good, ⚠️ improve)\n3. One tip\n\nFormat:\n---SCORES---\n{json}\n---FEEDBACK---\nlines\n---TIP---\ntip`}]});
      const raw=data.content?.[0]?.text||"";
      const sc=raw.split("---SCORES---")[1]?.split("---FEEDBACK---")[0]?.trim();
      const fb=raw.split("---FEEDBACK---")[1]?.split("---TIP---")[0]?.trim();
      const tip=raw.split("---TIP---")[1]?.trim();
      let scores={};
      try{scores=JSON.parse((sc||"{}").replace(/```json|```/g,"").trim());}catch{}
      setOralFeedback({scores,lines:(fb||"").split("\n").filter(l=>l.trim()),tip});
    } catch { setOralFeedback({scores:{},lines:["Erreur lors de l'évaluation."],tip:""}); }
    setOralEval(false);
  }

  return (
    <div style={{fontFamily:"Georgia,serif",background:DARK,color:TXT,minHeight:"100vh",paddingBottom:80}}>

      {/* Header */}
      <div style={{background:CARD,borderBottom:`1px solid ${BORDER}`,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18,fontWeight:700,color:ACC,letterSpacing:"-0.5px"}}>LinguaAI</span>
          <Tag color={ACC}>{cefr}</Tag>
          <Tag color="#60a5fa">{lang.flag} {lang.label}</Tag>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <select value={lang.code} onChange={e=>changeLang(e.target.value)} style={{fontSize:13,padding:"4px 8px",borderRadius:8,border:`1px solid ${BORDER}`,background:CARD2,color:TXT,cursor:"pointer"}}>
            {LANGS.map(l=><option key={l.code} value={l.code}>{l.flag} {l.label}</option>)}
          </select>
          <button onClick={()=>fileRef.current?.click()} style={{fontSize:12,padding:"5px 10px",borderRadius:8,border:`1px solid ${BORDER}`,background:CARD2,color:TXT,cursor:"pointer"}}>📂 xlsx / csv / txt / md</button>
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv,.txt,.md" style={{display:"none"}} onChange={handleImport} />
          <button onClick={genJournal} style={{fontSize:12,padding:"5px 10px",borderRadius:8,border:`1px solid ${BORDER}`,background:CARD2,color:TXT,cursor:"pointer"}}>📓 Journal</button>
          <button className="mob-toggle" onClick={()=>setPanelOpen(p=>!p)} style={{display:"none",fontSize:12,padding:"5px 10px",borderRadius:8,border:`1px solid ${ACC}44`,background:ACC+"18",color:ACC,cursor:"pointer"}}>📊 {panelOpen?"Masquer stats":"Stats"}</button>
        </div>
      </div>

      {importMsg && <div style={{textAlign:"center",fontSize:13,padding:"6px 12px",background:importMsg.startsWith("✅")?"#064e3b":"#450a0a",color:importMsg.startsWith("✅")?"#6ee7b7":"#fca5a5"}}>{importMsg}</div>}

      <div className="layout" style={{paddingTop:12}}>

        {/* Colonne principale */}
        <div>
          {/* Onglets */}
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            {[["chat","💬 Chat"],["quiz","🧠 Quiz"],["oral","🎙️ Oral"]].map(([m,l])=>(
              <button key={m} onClick={()=>{if(m==="quiz")genQuiz();else{setMode(m);if(m==="oral"&&!oralText)genOralText();}}} style={{fontSize:13,padding:"5px 16px",borderRadius:20,border:`1px solid ${mode===m?ACC:BORDER}`,background:mode===m?ACC+"22":"transparent",color:mode===m?ACC:TXTS,cursor:"pointer",fontWeight:mode===m?600:400,transition:"all 0.2s"}}>{l}</button>
            ))}
          </div>

          {/* CHAT */}
          {mode==="chat" && (
            <>
              <div style={{height:400,overflowY:"auto",borderRadius:14,border:`1px solid ${BORDER}`,background:CARD,padding:"12px 10px",display:"flex",flexDirection:"column",gap:12}}>
                {messages.map((m,i)=>(
                  <div key={i} className="msg-in" style={{display:"flex",flexDirection:m.role==="user"?"row-reverse":"row",alignItems:"flex-end",gap:8}}>
                    {m.role==="assistant" && <div style={{width:32,height:32,borderRadius:"50%",background:ACC+"33",border:`1px solid ${ACC}66`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:ACC,fontWeight:700,flexShrink:0}}>AI</div>}
                    <div style={{maxWidth:"78%",padding:"10px 14px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.role==="user"?ACC+"33":CARD2,color:TXT,fontSize:14,lineHeight:1.6,border:`1px solid ${m.role==="user"?ACC+"44":BORDER}`}}>
                      <div style={{whiteSpace:"pre-wrap"}}>{m.text}</div>
                      <div style={{fontSize:10,color:TXTT,marginTop:4,textAlign:"right"}}>{m.ts}</div>
                    </div>
                  </div>
                ))}
                {loading && <div style={{display:"flex",alignItems:"center",gap:8,paddingLeft:40}}>{[0,1,2].map(i=><span key={i} style={{width:7,height:7,borderRadius:"50%",background:ACC,display:"inline-block",animation:`dot 1.2s ${i*0.2}s infinite`}}/>)}</div>}
                <div ref={bottomRef}/>
              </div>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder={`Écris en ${lang.label}… (Entrée pour envoyer)`} rows={2} style={{flex:1,fontSize:14,padding:"10px 14px",borderRadius:12,border:`1px solid ${BORDER}`,background:CARD,color:TXT,resize:"none",lineHeight:1.5,outline:"none"}}/>
                <button onClick={send} disabled={loading||!input.trim()} style={{padding:"0 20px",borderRadius:12,border:"none",background:loading||!input.trim()?BORDER:ACC,color:loading||!input.trim()?TXTT:"#fff",cursor:loading||!input.trim()?"default":"pointer",fontWeight:600,fontSize:14}}>↑</button>
              </div>
              <div style={{fontSize:11,color:TXTT,marginTop:4,textAlign:"right"}}>Shift+Entrée pour nouvelle ligne</div>
            </>
          )}

          {/* ORAL */}
          {mode==="oral" && (
            <div style={{borderRadius:14,border:`1px solid ${BORDER}`,background:CARD,padding:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
                <span style={{fontWeight:600,fontSize:15,color:ACC}}>🎙️ Expression Orale — {lang.label}</span>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <select onChange={e=>genOralText(e.target.value)} value={oralTopic} style={{fontSize:12,padding:"4px 8px",borderRadius:8,border:`1px solid ${BORDER}`,background:CARD2,color:TXT,cursor:"pointer"}}>
                    <option value="">Sujet aléatoire</option>
                    {ORAL_THEMES.map(t=><option key={t} value={t}>{t}</option>)}
                  </select>
                  <button onClick={()=>genOralText(oralTopic)} style={{fontSize:12,padding:"4px 12px",borderRadius:8,border:`1px solid ${BORDER}`,background:CARD2,color:TXT,cursor:"pointer"}}>🔄 Nouveau texte</button>
                </div>
              </div>
              <div style={{background:CARD2,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:14,minHeight:80}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontSize:11,color:TXTT,fontStyle:"italic"}}>📖 Lisez ce texte à voix haute ou écoutez-le :</span>
                  <div style={{display:"flex",gap:6}}>
                    {!speaking
                      ? <button onClick={()=>speakText(oralText)} disabled={!oralText||oralLoading} style={{fontSize:12,padding:"4px 10px",borderRadius:8,border:`1px solid ${ACC}44`,background:ACC+"18",color:ACC,cursor:"pointer"}}>▶ Écouter</button>
                      : <button onClick={stopSpeak} style={{fontSize:12,padding:"4px 10px",borderRadius:8,border:"1px solid #ef4444",background:"#450a0a",color:"#fca5a5",cursor:"pointer"}}>⏹ Stop</button>
                    }
                  </div>
                </div>
                {oralLoading ? <div style={{color:TXTS,fontSize:14,fontStyle:"italic"}}>Génération du texte…</div>
                  : <div style={{fontSize:14,lineHeight:1.75,color:TXT,whiteSpace:"pre-wrap"}}>{oralText}</div>}
              </div>
              <div style={{background:CARD2,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <span style={{fontSize:13,color:TXTS,fontWeight:500}}>🗣️ Votre expression orale</span>
                  <div style={{display:"flex",gap:6}}>
                    {!listening
                      ? <button onClick={startListen} style={{fontSize:13,padding:"6px 14px",borderRadius:10,border:`1px solid ${ACC}`,background:ACC+"22",color:ACC,cursor:"pointer",fontWeight:600}}>🎤 Parler</button>
                      : <button onClick={stopListen} style={{fontSize:13,padding:"6px 14px",borderRadius:10,border:"1px solid #ef4444",background:"#450a0a",color:"#fca5a5",cursor:"pointer",fontWeight:600}}>⏹ Arrêter</button>
                    }
                    {transcript && <button onClick={evalOral} disabled={oralEval} style={{fontSize:13,padding:"6px 14px",borderRadius:10,border:"1px solid #60a5fa",background:"#1e3a5f",color:"#93c5fd",cursor:"pointer",fontWeight:600}}>✅ Évaluer</button>}
                  </div>
                </div>
                {listening && <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{width:10,height:10,borderRadius:"50%",background:"#ef4444",display:"inline-block",animation:"dot 1s infinite"}}/><span style={{fontSize:12,color:"#fca5a5"}}>Écoute en cours…</span></div>}
                <div style={{minHeight:60,fontSize:14,color:transcript?TXT:TXTT,lineHeight:1.6,fontStyle:transcript?"normal":"italic"}}>{transcript||"Votre transcription apparaîtra ici en temps réel…"}</div>
                {transcript && <button onClick={()=>setTranscript("")} style={{marginTop:6,fontSize:11,padding:"3px 8px",borderRadius:6,border:`1px solid ${BORDER}`,background:"transparent",color:TXTT,cursor:"pointer"}}>✕ Effacer</button>}
              </div>
              {oralEval && <div style={{textAlign:"center",color:TXTS,fontSize:13,padding:16}}>Analyse de votre expression…</div>}
              {oralFeedback && !oralEval && (
                <div style={{background:CARD2,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,animation:"pop 0.3s ease"}}>
                  <div style={{fontWeight:600,fontSize:13,color:ACC,marginBottom:10}}>📊 Résultat</div>
                  {oralFeedback.scores && Object.keys(oralFeedback.scores).length>0 && (
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
                      {[["Fluidité",oralFeedback.scores.fluency,ACC],["Vocabulaire",oralFeedback.scores.vocabulary,"#60a5fa"],["Grammaire",oralFeedback.scores.grammar,"#a78bfa"]].map(([l,v,c])=>(
                        <div key={l} style={{textAlign:"center",padding:"8px 6px",borderRadius:8,background:DARK,border:`1px solid ${BORDER}`}}>
                          <div style={{fontSize:10,color:TXTT,marginBottom:4}}>{l}</div>
                          <div style={{fontSize:22,fontWeight:700,color:c}}>{v}<span style={{fontSize:12,color:TXTT}}>/10</span></div>
                        </div>
                      ))}
                    </div>
                  )}
                  {oralFeedback.lines.map((f,i)=>(
                    <div key={i} style={{fontSize:12,lineHeight:1.5,padding:"7px 10px",marginBottom:5,borderRadius:8,background:f.startsWith("✅")?"#064e3b":f.startsWith("⚠️")?"#451a03":DARK,color:f.startsWith("✅")?"#6ee7b7":f.startsWith("⚠️")?"#fcd34d":TXTS,border:`1px solid ${f.startsWith("✅")?"#065f46":f.startsWith("⚠️")?"#78350f":BORDER}`}}>{f}</div>
                  ))}
                  {oralFeedback.tip && <div style={{marginTop:8,fontSize:12,color:"#93c5fd",background:"#1e3a5f",padding:"8px 12px",borderRadius:8,lineHeight:1.55}}>💡 Conseil : {oralFeedback.tip}</div>}
                </div>
              )}
            </div>
          )}

          {/* QUIZ */}
          {mode==="quiz" && (
            <div style={{borderRadius:14,border:`1px solid ${BORDER}`,background:CARD,padding:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <span style={{fontWeight:600,fontSize:15,color:ACC}}>Quiz — {lang.label}</span>
                <button onClick={genQuiz} style={{fontSize:12,padding:"5px 12px",borderRadius:8,border:`1px solid ${BORDER}`,background:CARD2,color:TXT,cursor:"pointer"}}>🔄 Nouveau</button>
              </div>
              {quizLoading && <div style={{textAlign:"center",color:TXTS,padding:40,fontSize:14}}>Génération du quiz…</div>}
              {!quizLoading && quiz && quiz.length===0 && <div style={{textAlign:"center",color:TXTS,padding:40}}>Erreur. Réessayez.</div>}
              {!quizLoading && quiz && quiz.map((q,qi)=>(
                <div key={qi} style={{marginBottom:18,padding:14,borderRadius:12,background:CARD2,border:`1px solid ${BORDER}`,animation:"pop 0.3s ease"}}>
                  <div style={{marginBottom:6,display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontWeight:700,fontSize:16,color:TXT}}>{q.word}</span>
                    <Tag color="#a78bfa">{q.type}</Tag>
                  </div>
                  <div style={{fontSize:13,color:TXTS,marginBottom:10}}>{q.question}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    {q.choices.map((c,ci)=>{
                      let bg=CARD,bc=BORDER,col=TXT;
                      if (q.answered){if(ci===q.correct){bg="#064e3b";bc=ACC;col="#6ee7b7";}else if(ci===q.selected){bg="#450a0a";bc="#ef4444";col="#fca5a5";}}
                      return <button key={ci} onClick={()=>answerQuiz(qi,ci)} style={{padding:"8px 10px",borderRadius:8,border:`1px solid ${bc}`,background:bg,color:col,cursor:q.answered?"default":"pointer",fontSize:13,textAlign:"left",transition:"all 0.2s"}}>{c}</button>;
                    })}
                  </div>
                  {q.answered && <div style={{marginTop:10,fontSize:12,color:"#6ee7b7",background:"#064e3b",padding:"8px 12px",borderRadius:8,lineHeight:1.55}}>💡 {q.explanation}</div>}
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Panneau latéral */}
        {panelOpen && (
          <div className="side-panel" style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:14,padding:14}}>
            <div style={{fontWeight:600,fontSize:14,color:ACC,marginBottom:14}}>📊 Progression</div>
            <div style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:TXTS,marginBottom:4}}><span>Niveau global</span><span style={{color:ACC,fontWeight:600}}>{cefr}</span></div>
              <div style={{display:"flex",gap:3}}>
                {CEFR.map(l=><div key={l} style={{flex:1,height:20,borderRadius:4,background:CEFR.indexOf(l)<=CEFR.indexOf(cefr)?ACC:BORDER,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:CEFR.indexOf(l)<=CEFR.indexOf(cefr)?"#fff":TXTT,fontWeight:600,transition:"background 0.4s"}}>{l}</div>)}
              </div>
            </div>
            {[["Grammaire",stats.grammar,ACC],["Vocabulaire",stats.vocabulary,"#60a5fa"],["Fluidité",stats.fluency,"#a78bfa"]].map(([lbl,val,col])=>(
              <div key={lbl} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:TXTS}}><span>{lbl}</span><span style={{color:col}}>{val}%</span></div>
                <Bar pct={val} color={col}/>
              </div>
            ))}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14,marginTop:4}}>
              {[["Messages",stats.msgs],["Corrections",stats.corrections],["Quiz",stats.quizDone],["Mots",vocab.length>0?`${Math.min(stats.quizDone*2,vocab.length)}/${vocab.length}`:"—"]].map(([l,v])=>(
                <div key={l} style={{padding:"8px 10px",borderRadius:8,background:CARD2,border:`1px solid ${BORDER}`}}>
                  <div style={{fontSize:10,color:TXTT}}>{l}</div>
                  <div style={{fontSize:16,fontWeight:600,color:TXT,marginTop:2}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:12,fontWeight:600,color:TXTS,marginBottom:8}}>Corrections récentes</div>
              {feedback.length===0 && <div style={{fontSize:12,color:TXTT,fontStyle:"italic"}}>Écris un message pour recevoir des corrections…</div>}
              {feedback.slice(0,5).map((f,i)=>(
                <div key={i} style={{fontSize:12,lineHeight:1.5,padding:"7px 10px",marginBottom:5,borderRadius:8,background:f.startsWith("✅")?"#064e3b":"#451a03",color:f.startsWith("✅")?"#6ee7b7":"#fcd34d",border:`1px solid ${f.startsWith("✅")?"#065f46":"#78350f"}`,animation:"pop 0.3s ease"}}>{f}</div>
              ))}
            </div>
            <div>
              <div style={{fontSize:12,fontWeight:600,color:TXTS,marginBottom:8}}>🎯 Objectifs</div>
              {objectives.map((o,i)=>(
                <div key={i} style={{display:"flex",gap:6,alignItems:"flex-start",marginBottom:6}}>
                  <span style={{color:ACC,fontSize:12,marginTop:1}}>◆</span>
                  <span style={{fontSize:12,color:TXT,flex:1,lineHeight:1.4}}>{o}</span>
                  <button onClick={()=>setObjectives(p=>p.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:TXTT,cursor:"pointer",fontSize:12,padding:0,flexShrink:0}}>✕</button>
                </div>
              ))}
              {addingObj ? (
                <div style={{display:"flex",gap:6,marginTop:6}}>
                  <input value={newObj} onChange={e=>setNewObj(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newObj.trim()){setObjectives(p=>[...p,newObj.trim()]);setNewObj("");setAddingObj(false);}}} placeholder="Nouvel objectif…" autoFocus style={{flex:1,fontSize:12,padding:"5px 8px",borderRadius:7,border:`1px solid ${BORDER}`,background:CARD2,color:TXT}}/>
                  <button onClick={()=>{if(newObj.trim()){setObjectives(p=>[...p,newObj.trim()]);setNewObj("");setAddingObj(false);}}} style={{fontSize:11,padding:"4px 8px",borderRadius:7,border:`1px solid ${ACC}`,background:ACC+"22",color:ACC,cursor:"pointer"}}>+</button>
                </div>
              ) : (
                <button onClick={()=>setAddingObj(true)} style={{fontSize:12,marginTop:4,padding:"5px 10px",borderRadius:8,border:`1px solid ${BORDER}`,background:"transparent",color:TXTS,cursor:"pointer",width:"100%"}}>+ Ajouter un objectif</button>
              )}
            </div>
          </div>
        )}
      </div>

      {/* Journal modal */}
      {journalOpen && (
        <div style={{position:"fixed",inset:0,background:"#000a",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setJournalOpen(false)}>
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:16,padding:20,maxWidth:480,width:"100%",maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:16,color:ACC,marginBottom:14}}>📓 Journal de sessions</div>
            {journal.length===0 && <div style={{color:TXTS,fontSize:13}}>Aucune session enregistrée encore.</div>}
            {journal.map((j,i)=>(
              <div key={i} style={{marginBottom:14,padding:12,borderRadius:10,background:CARD2,border:`1px solid ${BORDER}`}}>
                <div style={{fontSize:11,color:TXTT,marginBottom:4}}>{j.date} — {j.lang}</div>
                <div style={{fontSize:13,color:TXT,lineHeight:1.6}}>{j.text}</div>
              </div>
            ))}
            <button onClick={()=>setJournalOpen(false)} style={{marginTop:8,fontSize:13,padding:"6px 16px",borderRadius:8,border:`1px solid ${BORDER}`,background:CARD2,color:TXT,cursor:"pointer"}}>Fermer</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
